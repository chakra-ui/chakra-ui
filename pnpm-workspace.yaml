packages:
  - packages/**/**
  - sandbox/**
  - apps/**

overrides:
  react: 19.2.6
  react-dom: 19.2.6
  immer: ">=11.0.1"
  # keep a single copy: CalendarDate uses private fields, so two versions
  # produce mutually incompatible types
  "@internationalized/date": 3.12.3

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

minimumReleaseAgeExclude:
  - '@ark-ui/react@5.38.2'
  - '@zag-js/accordion@1.43.1'
